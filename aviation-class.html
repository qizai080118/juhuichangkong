<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航空课堂</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="index.html" class="back-btn">← 返回首页</a>
<section class="page-banner" id="page-banner">
    <div class="banner-text">
        <h1 id="main-title"></h1>
        <p id="sub-title"></p>
    </div>
</section>

<div class="category-wrap" id="category-wrap"></div>
<div class="card-list" id="card-list"></div>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
const pageData = {
  "banner_bg": "assets/images/banner_class.jpg",
  "page_title": "航空课堂",
  "slogan_main": "航空课堂",
  "slogan_sub": "学习航空航天小知识",
  "search_placeholder": "搜索课程",
  "category_list": [
    {"icon":"assets/images/icon_aero.png","name":"飞机原理","desc":"认识飞行器构造"},
    {"icon":"assets/images/icon_model.png","name":"航天知识","desc":"火箭与宇宙探索"},
    {"icon":"assets/images/icon_all.png","name":"航空历史","desc":"航空发展故事"}
  ],
  "hot_courses": [
    {"cover":"assets/images/card01.jpg","title":"飞机的飞行秘密","desc":"了解升力与机翼原理","age":"科普向","class_num":"点赞980｜收藏245","plateId":101,"plateName":"飞机原理系列","videoUrl":"video/aviation1.mp4"},
    {"cover":"assets/images/card02.jpg","title":"火箭发射小科普","desc":"认识航天运载火箭","age":"科普向","class_num":"点赞1120｜收藏310","plateId":102,"plateName":"航天知识系列","videoUrl":"video/aviation2.mp4"},
    {"cover":"assets/images/card03.jpg","title":"航空发展简史","desc":"人类飞天的梦想历程","age":"科普向","class_num":"点赞860｜收藏198","plateId":103,"plateName":"航空历史系列","videoUrl":"video/aviation3.mp4"}
  ]
};

document.getElementById("page-banner").style.backgroundImage = `url(${pageData.banner_bg})`;
document.getElementById("main-title").innerText = pageData.slogan_main;
document.getElementById("sub-title").innerText = pageData.slogan_sub;

const catWrap = document.querySelector("#category-wrap");
let catHtml = "";
pageData.category_list.forEach(cat=>{
catHtml += `
<div class="category-item">
    <img src="${cat.icon}" alt="${cat.name}">
    <div>
        <h4>${cat.name}</h4>
        <p>${cat.desc}</p>
    </div>
</div>`;
})
catWrap.innerHTML = catHtml;

const listWrap = document.querySelector("#card-list");
let html = "";
pageData.hot_courses.forEach(item=>{
html += `
<div class="item-card">
    <img src="${item.cover}" alt="${item.title}">
    <div class="item-info">
        <h3><a href="player.html?plateId=${item.plateId}">${item.title}</a></h3>
        <p>${item.desc}</p>
        <p>${item.plateName} | ${item.class_num}</p>
    </div>
</div>`;
})
listWrap.innerHTML = html;
})
</script>
</body>
</html>
