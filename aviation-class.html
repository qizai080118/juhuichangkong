<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航空课堂</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="index.html" class="back-home">← 返回首页</a>
<section class="banner">
  <img id="aviation-banner-img" src="" alt="航空课堂横幅">
</section>
<div class="category-wrap" id="category-wrap"></div>
<div class="card-list" id="card-list"></div>

<script>
// 这个函数必须是全局，jsonp脚本会调用它
window.loadJsonCallback = function(pageData){
  console.log("✅回调被触发，拿到JSON数据",pageData);
  document.querySelector("#aviation-banner-img").src = pageData.banner_bg;

  let catHtml = "";
  pageData.category_list.forEach(cat=>{
    catHtml += `
    <div class="category-item">
      <img src="${cat.icon}" alt="${cat.name}">
      <div>
        <h4>${cat.name}</h4>
        <p>${cat.desc}</p>
      </div>
    </div>`;
  })
  document.querySelector("#category-wrap").innerHTML = catHtml;

  let cardHtml = "";
  pageData.hot_courses.forEach((item,idx)=>{
    cardHtml += `
    <div class="item-card" onclick="location.href='player.html?index=${idx}&page=aviation-class'">
      <img src="${item.cover}" alt="${item.title}">
      <div class="item-info">
        <h4>${item.title}</h4>
        <p>${item.desc}</p>
      </div>
    </div>`;
  })
  document.querySelector("#card-list").innerHTML = cardHtml;
}

// 动态加载jsonp脚本
const script = document.createElement('script');
script.src = "data/aviation-class.json";
script.onerror = function(){
  alert("❌脚本加载失败：检查路径、文件名大小写");
}
document.body.appendChild(script);
</script>
</body>
</html>
