<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程商城</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js"></script>
</head>
<body>
<a href="index.html" class="back-btn">← 返回首页</a>
<section class="page-banner" id="page-banner">
    <div class="banner-text">
        <h1 id="main-title"></h1>
        <p id="sub-title"></p>
    </div>
</section>
<div class="category-wrap" id="category-wrap"></div>
<div class="card-list" id="card-list"></div>

<script>
let allCourseData = [];
let pageDataGlobal = null;

document.addEventListener('DOMContentLoaded', ()=>{
    loadData("data/course-shop.json", function(err, pageData){
        if(err){
            document.body.innerHTML += `<div style="color:red;padding:16px">加载异常：${err.message}</div>`;
            return;
        }
        pageDataGlobal = pageData;
        document.getElementById("page-banner").style.backgroundImage = `url(${pageData.banner_bg})`;
        document.getElementById("main-title").innerText = pageData.slogan_main;
        document.getElementById("sub-title").innerText = pageData.slogan_sub;

        allCourseData = pageData.hot_courses;

        const catWrap = document.querySelector("#category-wrap");
        let catHtml = "";
        pageData.category_list.forEach((cat,catIndex)=>{
            catHtml += `
            <div class="category-item" onclick="filterByCategory(${catIndex})">
                <img src="${cat.icon}" alt="${cat.name}">
                <div>
                    <h4>${cat.name}</h4>
                    <p>${cat.desc}</p>
                </div>
            </div>`;
        })
        catWrap.innerHTML = catHtml;

        renderCards(allCourseData);
    })
})

//按分类下标筛选课程
function filterByCategory(catIdx){
    const filterList = allCourseData.filter(item=>{
        return item.category === catIdx;
    })
    renderCards(filterList);
}

//渲染卡片，用bvid匹配原始数组下标，保证跳转正常
function renderCards(courseList){
    const listWrap = document.querySelector("#card-list");
    let html = "";
    courseList.forEach((item)=>{
        const realIndex = allCourseData.findIndex(c => c.bvid === item.bvid);
        html += `
        <div class="item-card" onclick="location.href='player.html?index=${realIndex}&page=course-shop'">
            <img src="${item.cover}" alt="${item.title}">
            <div class="item-info">
                <h3>${item.title}</h3>
                <p>${item.desc}</p>
                <p>${item.age} | ${item.class_num}</p>
            </div>
        </div>`;
    })
    listWrap.innerHTML = html;
}
</script>
</body>
</html>
