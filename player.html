<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a id="back-btn" href="tech-drama.html" class="back-home">← 返回</a>
<div class="player-wrap">
  <div id="bilibili-box" style="width:100%;aspect-ratio:16/9;"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const indexVal = Number(params.get("index"));
const pageType = params.get("page");

let backHref = "tech-drama.html";
let jsonPath = "data/tech-drama.json";
if(pageType === "aviation-class"){
  backHref = "aviation-class.html";
  jsonPath = "data/aviation-class.json";
}else if(pageType === "course-shop"){
  backHref = "course-shop.html";
  jsonPath = "data/course-shop.json";
}
document.querySelector("#back-btn").href = backHref;

window.loadJsonCallback = function(res){
  console.log("✅播放页回调收到数据", res);
  const item = res.hot_courses[indexVal];
  document.querySelector("#bilibili-box").innerHTML =
  `<iframe src="//player.bilibili.com/player.html?bvid=${item.bvid}&page=1&high_quality=1" style="width:100%;height:100%;border:0;"></iframe>`;
};

const script = document.createElement("script");
script.src = jsonPath;
script.onerror = function(){
  alert("❌播放页读取JSONP失败");
};
document.body.appendChild(script);
</script>
</body>
</html>
