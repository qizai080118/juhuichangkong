<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>播放页面</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js"></script>
<style>
.player-box{
  position:relative;
  width:100%;
  padding-bottom:56.25%;
  height:0;
  overflow:hidden;
  border-radius:8px;
  background:#000;
}
.player-box iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>
<body>
<a href="index.html" class="back-btn">← 返回首页</a>
<div class="player-wrap">
    <h2 id="video-title"></h2>
    <p id="video-desc"></p>
    <div id="playerBox"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    const params = new URLSearchParams(location.search);
    const indexVal = params.get("index");
    const plateIdVal = params.get("plateId");

    // ==========科技漫剧：index模式 B站iframe==========
    if(indexVal !== null){
        loadData("data/tech-drama.json", function(err, data){
            if(err){
                document.getElementById("playerBox").innerText = "数据加载失败";
                return;
            }
            const idx = Number(indexVal);
            const item = data.hot_courses[idx];
            if(!item || !item.bvid){
                document.getElementById("playerBox").innerText = "未找到该视频";
                return;
            }
            document.getElementById("video-title").innerText = item.title;
            document.getElementById("video-desc").innerText = item.desc;
            const iframe = document.createElement("iframe");
            iframe.src = `https://player.bilibili.com/player.html?bvid=${item.bvid}&page=1&autoplay=0&danmaku=0`;
            iframe.allowFullscreen = true;
            document.getElementById("playerBox").className = "player-box";
            document.getElementById("playerBox").appendChild(iframe);
        })
        return;
    }

    // ==========航空课堂 /课程商城 plateId模式，本地视频==========
    let allData = [];
    let finishCount = 0;
    function checkOneDone(){
        finishCount +=1;
        //三个全部加载完毕
        if(finishCount >=3){
            const pid = Number(plateIdVal);
            const findItem = allData.find(x=>x.plateId === pid);
            if(!findItem){
                document.body.innerHTML += `<div style="padding:30px;color:red;font-size:18px;">未找到该视频</div>`;
                return;
            }
            document.getElementById("video-title").innerText = findItem.title;
            document.getElementById("video-desc").innerText = findItem.desc;
            const video = document.createElement("video");
            video.controls = true;
            video.style.width = "100%";
            video.src = findItem.videoUrl;
            document.getElementById("playerBox").appendChild(video);
        }
    }

    loadData("data/aviation-class.json", function(err,res){
        if(!err) allData.push(...res.hot_courses);
        checkOneDone();
    })
    loadData("data/tech-drama.json", function(err,res){
        if(!err) allData.push(...res.hot_courses);
        checkOneDone();
    })
    loadData("data/course-shop.json", function(err,res){
        if(!err) allData.push(...res.hot_courses);
        checkOneDone();
    })
})
</script>
</body>
</html>
