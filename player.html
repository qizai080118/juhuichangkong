<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>播放页面</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js"></script>
</head>
<body>
<a href="index.html" class="back-btn">← 返回首页</a>
<div class="player-wrap">
    <h2 id="video-title"></h2>
    <p id="video-desc"></p>
    <video id="my-video" controls style="width:100%;max-width:800px;"></video>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
    let allData = [];
    let total = 3;
    let doneCount = 0;

    function checkFinish(){
        doneCount++;
        if(doneCount === total){
            const params = new URLSearchParams(location.search);
            const pid = Number(params.get("plateId"));
            const findItem = allData.find(d=>d.plateId === pid);
            if(!findItem){
                document.body.innerHTML = "<div style='padding:30px;color:red'>未找到该视频</div>";
            }else{
                document.getElementById("video-title").innerText = findItem.title;
                document.getElementById("video-desc").innerText = findItem.desc;
                document.getElementById("my-video").src = findItem.videoUrl;
            }
        }
    }

    loadData("data/aviation-class.json", function(err, d){
        if(!err) allData.push(...d.hot_courses);
        checkFinish();
    })
    loadData("data/tech-drama.json", function(err, d){
        if(!err) allData.push(...d.hot_courses);
        checkFinish();
    })
    loadData("data/course-shop.json", function(err, d){
        if(!err) allData.push(...d.hot_courses);
        checkFinish();
    })
})
</script>
</body>
</html>
