<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>播放页</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar-wrap"></nav>
<section class="banner">
<img id="banner-img" src="assets/images/banner-techdrama.jpg" alt="banner">
<div class="banner-text">
<h1 id="main-title">科技漫剧</h1>
<p id="sub-title">播放页面</p>
</div>
</section>
<div class="page-container">
<a href="tech-drama.html" class="back-home">← 返回科技漫剧列表</a>

<div style="max-width:900px;margin:30px auto;padding:0 16px;">
    <div style="width:100%;aspect-ratio:16/9;background:#222;border-radius:10px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;color:#fff;">
        视频播放区域
    </div>
    <div>
        <h1 id="title" style="font-size:26px;margin-bottom:12px;"></h1>
        <p id="desc" style="font-size:16px;line-height:1.6;color:#444;"></p>
    </div>
</div>

</div>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get("id"));
    fetch("data/tech-drama.json")
    .then(res=>res.json())
    .then(data=>{
        const item = data.hot_courses.find(i=>i.id===id);
        if(item){
            document.getElementById("title").innerText = item.title;
            document.getElementById("desc").innerText = item.desc;
        }else{
            document.getElementById("title").innerText = "内容不存在";
        }
    })
})
</script>
</body>
</html>
