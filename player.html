<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js"></script>
</head>
<body>
<a id="back-btn" href="tech-drama.html" class="back-btn">← 返回</a>
<div class="player-wrap">
  <div id="video-container" style="width:100%;aspect-ratio:16/9;"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const indexVal = Number(params.get("index"));
const pageType = params.get("page");

let backHref = "tech-drama.html";
let jsonPath = "data/tech-drama.json";

if(pageType === "aviation-class"){
  backHref = "aviation-class.html";
  jsonPath = "data/aviation-class.json";
}else if(pageType === "course-shop"){
  backHref = "course-shop.html";
  jsonPath = "data/course-shop.json";
}
document.querySelector("#back-btn").href = backHref;

document.addEventListener('DOMContentLoaded',()=>{
  loadData(jsonPath, function(err,res){
    if(err){
      document.body.innerHTML += `<div style="color:red;padding:20px">加载失败：${err.message}</div>`;
      return;
    }
    const item = res.hot_courses[indexVal];
    document.querySelector("#video-container").innerHTML =
    `<iframe src="//player.bilibili.com/player.html?bvid=${item.bvid}&page=1&high_quality=1" style="width:100%;height:100%;border:none;"></iframe>`;
  })
})
</script>
</body>
</html>
