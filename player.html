<style>
.player-wrap{
  max-width:900px;
  margin:30px auto;
  padding:0 16px;
}
.video-box{
  width:100%;
  aspect-ratio:16/9;
  background:#222;
  border-radius:8px;
  margin-bottom:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}
.info-box h1{
  font-size:26px;
  margin-bottom:12px;
}
.info-box p{
  font-size:16px;
  line-height:1.6;
  color:#444;
}
</style>

<div class="player-wrap">
  <div class="video-box">
    <!-- 这里后续可以嵌入视频标签 <video src="xxx.mp4" controls></video> -->
    视频播放区域
  </div>
  <div class="info-box">
    <h1 id="title"></h1>
    <p id="desc"></p>
  </div>
</div>

<script>
// 读取和tech‑drama.html同一个json文件，路径不变
const jsonUrl = "/data/tech‑drama.json";

// 获取url里的id参数
const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id"));

fetch(jsonUrl)
.then(res=>res.json())
.then(data=>{
  // json数组下标从0开始，id=1对应数组第0项
  const item = data[id-1];
  if(item){
    document.getElementById("title").innerText = item.title;
    document.getElementById("desc").innerText = item.excerpt;
  }else{
    document.getElementById("title").innerText = "内容不存在";
    document.getElementById("desc").innerText = "找不到该集内容";
  }
})
</script>
