<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>播放页</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar‑wrap"></nav>
<section class="banner">
<img id="banner‑img" src="" alt="banner">
<div class="banner‑text">
<h1 id="main‑title"></h1>
<p id="sub‑title"></p>
</div>
</section>
<div class="page‑container">
<a href="tech‑drama.html" class="back‑home">← 返回科技漫剧列表</a>

<div class="player‑wrap">
    <div class="video‑box">
        <!-- 视频区域，后续替换为video标签 -->
        视频播放区域
    </div>
    <div class="info‑box">
        <h1 id="title"></h1>
        <p id="desc"></p>
    </div>
</div>

</div>

<script src="assets/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get("id"));

    initPage("data/tech‑drama.json", function(data){
        document.getElementById("banner‑img").src = data.banner_bg;
        document.getElementById("main‑title").innerText = data.slogan_main;
        document.getElementById("sub‑title").innerText = data.slogan_sub;

        const item = data.hot_courses.find(i => i.id === id);
        if(item){
            document.getElementById("title").innerText = item.title;
            document.getElementById("desc").innerText = item.desc;
        }else{
            document.getElementById("title").innerText = "内容不存在";
            document.getElementById("desc").innerText = "找不到该集内容";
        }
    })
})
</script>
</body>
</html>
