<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="javascript:history.back()" class="back-btn">← 返回上一页</a>

<div class="player-wrap" id="player-box"></div>

<script src="assets/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const plateId = Number(params.get("plateId"));

    let jsonPath;
    if(plateId >=101 && plateId <=199){
        jsonPath = "data/aviation-class.json";
    }else if(plateId >=201 && plateId <=299){
        jsonPath = "data/tech-drama.json";
    }else if(plateId >=301 && plateId <=399){
        jsonPath = "data/course‑shop.json";
    }else{
        document.getElementById("player-box").innerHTML="<p>找不到对应视频</p>";
        return;
    }

    initPage(jsonPath, function(data){
        const res = data.hot_courses.find(item=>item.plateId === plateId);
        const box = document.getElementById("player-box");
        if(!res){
            box.innerHTML="<p>未找到视频</p>";
            return;
        }
        box.innerHTML = `
            <h2>${res.title}</h2>
            <p>${res.desc}</p>
            <video controls src="${res.videoUrl}"></video>
            <p>${res.plateName} | ${res.class_num}</p>
        `
    })
})
</script>
</body>
</html>
