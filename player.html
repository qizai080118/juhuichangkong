<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="tech-drama.html" class="back-home">← 返回科技漫剧</a>
<div class="player-wrap">
  <video id="video-player" controls></video>
</div>

<script>
function loadJson(url, callback){
  window.loadback = function(data){
    callback(null, data);
  };
  const s = document.createElement('script');
  s.src = url;
  s.onerror = ()=>callback(new Error("加载失败:"+url),null);
  document.body.appendChild(s);
}

document.addEventListener('DOMContentLoaded', ()=>{
  const indexVal = Number(new URLSearchParams(location.search).get("index"));
  loadJson("data/tech-drama.json", function(err, res){
    if(err) return;
    const videoItem = res.hot_courses[indexVal];
    document.querySelector("#video-player").src = videoItem.videoUrl;
  })
})
</script>
</body>
</html>
