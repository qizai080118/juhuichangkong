<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汇聚长空</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js"></script>
</head>
<body>
<section class="home-entry-wrap" id="home-wrap">
<!-- 首页卡片由json动态渲染 -->
</section>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
    loadData("data/index.json", function(err, pageData){
        if(err){
            document.body.innerHTML += `<div style="color:red;padding:16px">加载异常：${err.message}</div>`;
            return;
        }
        let html = "";
        pageData.home_list.forEach(item=>{
            html += `
            <div class="home-entry-item" onclick="location.href='${item.link}'">
                <div class="home-entry-title">${item.title}</div>
                <img class="home-entry-bg" src="${item.bg_img}" alt="${item.title}">
            </div>`;
        })
        document.querySelector("#home-wrap").innerHTML = html;
    })
})
</script>
</body>
</html>
