<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汇聚长空</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js"></script>
</head>
<body>
<!-- 首页横幅banner -->
<section class="page-banner" id="home-banner">
    <div class="banner-text">
        <h1 id="home-title"></h1>
        <p id="home-sub"></p>
    </div>
</section>

<section class="home-entry-wrap" id="home-wrap">
<!-- 首页卡片由json动态渲染 -->
</section>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
    // 读取 data/home.json
    loadData("data/home.json", function(err, pageData){
        if(err){
            document.body.innerHTML += `<div style="color:red;padding:16px">加载异常：${err.message}</div>`;
            return;
        }
        // 渲染首页banner横幅
        document.getElementById("home-banner").style.backgroundImage = `url(${pageData.banner_bg})`;
        document.getElementById("home-title").innerText = pageData.slogan_main;
        document.getElementById("home-sub").innerText = pageData.slogan_sub;

        // 渲染首页入口卡片
        let html = "";
        pageData.home_list.forEach(item=>{
            html += `
            <div class="home-entry-item" onclick="location.href='${item.link}'">
                <div class="home-entry-title">${item.title}</div>
                <img class="home-entry-bg" src="${item.bg_img}" alt="${item.title}">
            </div>`;
        })
        document.querySelector("#home-wrap").innerHTML = html;
    })
})
</script>
</body>
</html>
