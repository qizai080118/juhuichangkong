<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>少年航空科普</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar-wrap"></nav>
<section class="banner">
    <img id="home-banner-image" src="" alt="首页横幅">
</section>
<div id="home-modules-wrap"></div>

<script src="assets/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
initPage("data/home.json", function(data){
    document.querySelector("#home-banner-image").src = data.banner.bg_image;
    const moduleWrap = document.querySelector("#home-modules-wrap");
    let html = "";
    data.modules.forEach(item=>{
        html += `
        <div class="home-entry-item" onclick="window.location.href='${item.link}'">
            <div class="home-entry-title">${item.title}</div>
            <div class="home-entry-desc">${item.summary}</div>
        </div>`;
    })
    moduleWrap.innerHTML = html;
})
})
</script>
</body>
</html>
