<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>少年航空科普</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar-wrap"></nav>
<section class="banner">
  <img id="home-banner-image" src="" alt="首页横幅">
</section>
<div id="home-modules-wrap"></div>

<script>
// jsonp加载，回调函数统一为 loadback
function loadJson(url, callback){
  window.loadback = function(data){
    callback(null, data);
  };
  const s = document.createElement('script');
  s.src = url;
  s.onerror = ()=>callback(new Error("加载失败:"+url),null);
  document.body.appendChild(s);
}

document.addEventListener('DOMContentLoaded', ()=>{
loadJson("data/home.json", function(err, data){
  if(err){
    document.body.innerHTML += `<div style="color:red;padding:20px">首页数据加载异常 ${err.message}</div>`;
    return;
  }
  document.querySelector("#home-banner-image").src = data.banner.bg_image;
  const wrap = document.querySelector("#home-modules-wrap");
  let html = "";
  data.modules.forEach(item=>{
    html += `
    <div class="home-entry-item" onclick="location.href='${item.link}'">
      <div class="home-entry-title">${item.title}</div>
      <div class="home-entry-desc">${item.summary}</div>
    </div>`;
  })
  wrap.innerHTML = html;
})
})
</script>
</body>
</html>
