<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧绘长空</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei","PingFang SC",sans-serif}
body{background:#f8fafc;padding:10px}
.header-nav{display:flex;align-items:center;background:#fff;padding:12px 30px;box-shadow:0 2px 12px rgba(0,0,0,0.08);border-radius:16px;margin-bottom:16px;flex-wrap:wrap;gap:6px 12px}
.logo-text{font-size:26px;font-weight:700;color:#165299;margin-right:28px;letter-spacing:1px;white-space:nowrap}
.header-nav a{text-decoration:none;color:#333;font-size:16px;padding:6px 12px;border-radius:8px;transition:background .2s;white-space:nowrap}
.header-nav a:hover{background:#eef4ff;color:#165299}
.header-nav a.active{color:#2980d8;background:#e3edfc;font-weight:600}
.login-btn{margin-left:auto;background:#e64340;color:#fff;border:none;font-size:16px;padding:8px 26px;border-radius:30px;cursor:pointer;font-weight:500}
.login-btn:hover{background:#cf2e2b}
.banner{height:280px;background:linear-gradient(135deg,#7bbdf2,#c7e3fc);border-radius:16px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;color:#1a3a5c;font-size:32px;font-weight:600;letter-spacing:4px;position:relative;overflow:hidden}
.banner::after{content:"✈ 让航空戏剧点亮校园 ✈";font-size:clamp(20px,4vw,42px);opacity:.9;text-shadow:0 2px 12px rgba(255,255,255,0.3)}
.card-wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.card{border-radius:20px;padding:24px 20px 28px;box-shadow:0 4px 16px rgba(0,0,0,0.05);background:#fff;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,0.08)}
.card h2{font-size:22px;margin-bottom:14px;display:flex;align-items:center;gap:6px;font-weight:700;color:#1a2e4a}
.card p,.card li,.card div{font-size:14px;line-height:1.8;color:#2c3e50}
.card ul{list-style:none;padding:0}
.card ul li{padding:4px 0 4px 20px;position:relative}
.card ul li::before{content:"•";position:absolute;left:2px;color:#2980d8;font-weight:700}
.card1{background:#e2edfc}.card1 h2{color:#1a4a7a}
.card2{background:#fff3f3}.card2 h2{color:#b13e3e}
.card3{background:#d6efec}.card3 h2{color:#1a6b63}
.card4{background:#fff2dc}.card4 h2{color:#a87a2e}
.card5{background:linear-gradient(135deg,#e8cff8,#ffdfb8)}.card5 h2{color:#5e3a7a}
.card .sub-item{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.06)}
.card .sub-item:first-of-type{border-top:none;margin-top:0;padding-top:0}
.card .sub-item strong{display:block;font-size:15px;color:#1a2e4a;margin-bottom:2px}
.card .sub-item p{margin:0}
@media (max-width:1024px){.card-wrap{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.header-nav{padding:10px 16px}.logo-text{font-size:22px}.header-nav a{font-size:14px;padding:4px 8px}.login-btn{font-size:14px;padding:6px 16px}.card-wrap{grid-template-columns:repeat(2,1fr)}.banner{height:180px}.banner::after{font-size:18px}}
@media (max-width:480px){.card-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header-nav">
    <div class="logo-text">剧绘长空</div>
    <a href="#" class="active">项目介绍</a>
    <a href="#">剧目展演</a>
    <a href="#">航空课堂</a>
    <a href="#">校园传承</a>
    <a href="#">建设成果</a>
    <a href="#">成果排行</a>
    <a href="#">加入我们</a>
    <button class="login-btn">登录/注册</button>
</div>
<div class="banner"></div>
<div class="card-wrap">
    <div class="card card1"><h2>📖 项目介绍</h2><div id="card1">⏳ 加载中…</div></div>
    <div class="card card2"><h2>🎭 戏剧演出</h2><div id="card2">⏳ 加载中…</div></div>
    <div class="card card3"><h2>✈️ 航空科普</h2><div id="card3">⏳ 加载中…</div></div>
    <div class="card card4"><h2>🏫 校园活动</h2><div id="card4">⏳ 加载中…</div></div>
    <div class="card card5"><h2>🏆 成果展示</h2><div id="card5">⏳ 加载中…</div></div>
</div>

<script>
// =============================================================
//  同源请求 data.json（与页面在同一域名下，无跨域问题）
// =============================================================
const DATA_URL = "data.json?v=" + Date.now();  // 加时间戳强制刷新

const c1 = document.getElementById('card1');
const c2 = document.getElementById('card2');
const c3 = document.getElementById('card3');
const c4 = document.getElementById('card4');
const c5 = document.getElementById('card5');

function render(data) {
    if (!data || !data.cardList || data.cardList.length < 5) {
        throw new Error("数据格式无效：cardList 缺失或长度不足");
    }
    const list = data.cardList;

    // 项目介绍
    c1.innerHTML = (list[0].items || []).map(i => 
        `<div class="sub-item"><strong>● ${i.subtitle}</strong><p>${i.desc}</p></div>`
    ).join('') || '暂无内容';

    // 戏剧演出
    const works = list[1].works || [];
    c2.innerHTML = works.length ? 
        '<ul>' + works.map(w => `<li>${w.name}</li>`).join('') + '</ul>' : '暂无剧目';

    // 航空科普
    c3.innerHTML = (list[2].content || '').replace(/\n/g, '<br>') || '暂无科普';

    // 校园活动
    c4.innerHTML = (list[3].content || '').replace(/\n/g, '<br>') || '暂无活动';

    // 成果展示
    const sub = list[4].subTitleList || [];
    c5.innerHTML = sub.length ? 
        '<ul>' + sub.map(s => `<li>${s}</li>`).join('') + '</ul>' : '暂无成果';
}

function showError(msg) {
    const err = `<span style="color:#c0392b;">❌ ${msg}</span>`;
    [c1, c2, c3, c4, c5].forEach(el => el.innerHTML = err);
}

fetch(DATA_URL)
    .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status} — ${res.statusText}`);
        return res.json();
    })
    .then(json => {
        console.log("✅ 数据加载成功:", json);
        render(json);
    })
    .catch(err => {
        console.error("❌ 加载失败:", err);
        showError(`加载失败: ${err.message}。请确保 data.json 在仓库根目录。`);
    });
</script>
</body>
</html>
