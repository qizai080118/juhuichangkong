<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>科技漫剧</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar‑wrap"></nav>
<section class="banner">
<img id="banner‑img" src="" alt="banner">
<div class="banner‑text">
<h1 id="main‑title"></h1>
<p id="sub‑title"></p>
</div>
</section>
<div class="page‑container">
<a href="index.html" class="back‑home">← 返回首页</a>

<!-- 横排分类导航 -->
<div class="category‑bar">
<span data‑cat="all" class="active">全部</span>
<span data‑cat="航空航天冷知识">航空航天冷知识</span>
<span data‑cat="两弹一星科学家传记系列">两弹一星科学家传记系列</span>
</div>

<div class="card‑list" id="class‑list"></div>
</div>

<script src="assets/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    initPage("data/tech‑drama.json", function(data){
        // banner 头部
        document.getElementById("banner‑img").src = data.banner_bg;
        document.getElementById("main‑title").innerText = data.slogan_main;
        document.getElementById("sub‑title").innerText = data.slogan_sub;

        const listWrap = document.querySelector("#class‑list");
        let allList = data.hot_courses;
        let currentCat = "all";

        // 渲染卡片函数
        function render(){
            let showArr = allList;
            if(currentCat !== "all"){
                showArr = allList.filter(item => item.categories.includes(currentCat));
            }
            let html = "";
            showArr.forEach(item=>{
                html += `
                <div class="item‑card">
                    <img src="${item.cover}" alt="${item.title}">
                    <div class="item‑info">
                        <h3><a href="player.html?id=${item.id}">${item.title}</a></h3>
                        <p>${item.desc}</p>
                        <p>${item.age} | ${item.class_num}</p>
                    </div>
                </div>
                `
            })
            listWrap.innerHTML = html;
        }

        // 分类点击事件
        document.querySelectorAll(".category‑bar span").forEach(el=>{
            el.onclick = function(){
                document.querySelectorAll(".category‑bar span").forEach(x=>x.classList.remove("active"));
                this.classList.add("active");
                currentCat = this.dataset.cat;
                render();
            }
        })

        render();
    })
})
</script>
</body>
</html>
