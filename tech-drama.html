<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技漫剧</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js"></script>
</head>
<body>
<section>
<div class="banner" id="page-banner">    
<h1 id="main-title"></h1>    
<p id="sub-title"></p>
</div>
</section>
<div class="category-wrap" id="category-wrap"></div>
<div class="card-list" id="card-list"></div>

<script>
// 动态script加载jsonp风格，不用fetch，保留回调
function loadData(jsonPath, callback) {    
window.loadCallback = function(data) {        
callback(null, data);    
};    
const script = document.createElement('script');    
script.src = jsonPath;    
script.onerror = function(){        
callback(new Error("文件加载失败 " + jsonPath), null);    
};    
document.body.appendChild(script);
}

document.addEventListener('DOMContentLoaded', ()=>{
loadData("data/tech-drama.json", function(err, pageData){    
if(err){        
document.body.innerHTML += `<div style="color:red;padding:16px">加载异常：${err.message}</div>`;        
return;    
}    
// 设置横幅背景图
document.getElementById("page-banner").style.backgroundImage = `url(${pageData.banner_bg})`;    
// 修复：page_title为页面大标题，slogan_main为空
document.getElementById("main-title").innerText = pageData.page_title;    
document.getElementById("sub-title").innerText = pageData.slogan_sub;

    const catWrap = document.querySelector("#category-wrap");    
let catHtml = "";    
pageData.category_list.forEach(cat=>{        
catHtml += `
        <div class="category-item">
            <img src="${cat.icon}" alt="${cat.name}">
            <div>
                <h4>${cat.name}</h4>
                <p>${cat.desc}</p>
            </div>
        </div>`;    
})    
catWrap.innerHTML = catHtml;

    const listWrap = document.querySelector("#card-list");    
let html = "";    
pageData.hot_courses.forEach((item, index)=>{        
html += `
        <div class="item-card">
            <img src="${item.cover}" alt="${item.title}">
            <div class="item-info">
                <h3><a href="player.html?index=${index}">${item.title}</a></h3>
                <p>${item.desc}</p>
                <p>${item.plateName} | ${item.class_num}</p>
            </div>
        </div>`;    
})    
listWrap.innerHTML = html;
})
})
</script>
</body>
</html>
