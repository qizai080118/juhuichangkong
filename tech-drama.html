<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>科技漫剧</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box;}
body{padding:40px 20px;font‑family:system‑ui;}
#pageTitle{margin‑bottom:24px;}
.card‑wrap{display:grid;grid‑template‑columns:1fr 1fr;gap:16px;}
.drama‑card{
  border:1px solid #ccc;
  border‑radius:12px;
  padding:32px 16px;
  text‑align:center;
  background:#f5f7fa;
  cursor:pointer;
  font‑size:16px;
}
#tip{
  text‑align:center;
  font‑size:18px;
  color:#666;
  margin‑top:80px;
}
.error{
  color:red !important;
}
</style>
</head>
<body>
<h2 id="pageTitle"></h2>
<div id="tip">加载中...</div>
<div class="card‑wrap" id="cardWrap"></div>

<script>
async function initHome(){
  const tipDom = document.getElementById('tip');
  try{
    const res = await fetch('./tech‑drama.json');
    if(!res.ok){
      //404、403之类网络错误直接抛异常
      throw new Error("json文件获取失败");
    }
    const list = await res.json();

    tipDom.style.display = "none";
    document.getElementById('pageTitle').innerText = "科技漫剧";
    //去重获取4个板块
    const map = new Map();
    list.forEach(item=>{
      if(!map.has(item.plateId)){
        map.set(item.plateId, item.plateName);
      }
    })
    const plates = Array.from(map.entries());
    const wrapDom = document.getElementById('cardWrap');
    wrapDom.innerHTML = '';
    plates.forEach(([pid,pname])=>{
      const div = document.createElement('div');
      div.className = "drama‑card";
      div.innerText = pname;
      div.onclick = ()=>{
        location.href = `player.html?plateId=${pid}`;
      }
      wrapDom.appendChild(div);
    })
  }catch(err){
    console.error(err);
    tipDom.className = "error";
    tipDom.innerText = "数据加载失败，请检查json文件";
  }
}
initHome();
</script>
</body>
</html>
