<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
    <title>科技短剧｜绘鉴长空</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!--导航栏-->
    <nav class="navbar">
        <div class="nav‑container">
            绘鉴长空
            <div class="nav‑menu">
                首页
                科技短剧
                航空课堂
            </div>
        </div>
    </nav>

    <main class="page‑container">
        <h1>科技短剧</h1>
        <p class="subtitle">观看航空主题科普短剧</p >

        <div class="card‑list" id="dramaList">
            <!--内容由 data/tech‑drama.json 动态渲染-->
        </div>
    </main>

    <footer class="footer">
        <p>© 2025‑2026 绘鉴长空 航空科普</p >
    </footer>

    <script>
        //读取json数据渲染页面
        fetch("data/tech‑drama.json")
        .then(res=>res.json())
        .then(data=>{
            const wrap = document.getElementById("dramaList");
            data.items.forEach(item=>{
                const div = document.createElement("div");
                div.className = "card‑item";
                div.innerHTML = `
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p >
                    ${item.video ? `观看视频`:""}
                `;
                wrap.appendChild(div);
            })
        })
    </script>
</body>
</html>
