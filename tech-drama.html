<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技漫剧｜绘鉴长空</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!--导航栏-->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">绘鉴长空</a>
            <div class="nav-menu">
                <a href="index.html">首页</a>
                <a href="tech-drama.html" class="active">科技漫剧</a>
                <a href="aviation-class.html">航空课堂</a>
            </div>
        </div>
    </nav>

    <!--顶部大Banner-->
    <section class="drama-banner">
        <div class="banner-text">
            <h1>科技漫剧</h1>
            <p>用故事点亮科学梦想</p>
        </div>
    </section>

    <div class="page-wrap">
        <!--主内容区-->
        <main class="page-main">
            <!--分类标签栏-->
            <div class="tab-bar">
                <span class="tab-item active">全部漫剧</span>
                <span class="tab-item">科幻冒险</span>
                <span class="tab-item">航空航天</span>
                <span class="tab-item">未来科技</span>
                <span class="tab-item">成长励志</span>
                <span class="tab-item">知识科普</span>
                <span class="tab-item">轻松搞笑</span>
            </div>

            <!--热门推荐 横向卡片-->
            <section class="hot-recommend">
                <div class="section-title">
                    <h2>热门推荐</h2>
                    <a href="#" class="more">更多 ></a>
                </div>
                <div class="card-scroll-wrap" id="hotList">
                    <!--js渲染热门卡片-->
                </div>
            </section>

            <!--漫剧连载专区-->
            <section class="serial-area">
                <div class="section-title">
                    <h2>漫剧连载专区</h2>
                    <a href="#" class="more">更多 ></a>
                </div>
                <div class="card-grid-wrap" id="serialList">
                    <!--js渲染连载卡片-->
                </div>
            </section>
        </main>

        <!--右侧侧边栏-->
        <aside class="page-sidebar">
            <div class="side-card">
                <div class="side-title">今日更新 <a class="more">更多></a></div>
                <div id="todayUpdate"></div>
            </div>
            <div class="side-card">
                <div class="side-title">人气角色 <a class="more">更多></a></div>
                <div id="roleList"></div>
            </div>
            <div class="side-card check-card">
                <div class="side-title">学习打卡</div>
                <button class="check-btn">去打卡</button>
            </div>
        </aside>
    </div>

    <footer class="footer">
        <p>© 2025‑2026 绘鉴长空 航空科普</p>
    </footer>

    <script>
        fetch("data/tech-drama.json")
        .then(res=>res.json())
        .then(data=>{
            //热门推荐
            const hotWrap = document.getElementById("hotList");
            data.hot.forEach(item=>{
                hotWrap.innerHTML += `
                <div class="drama-card">
                    <div class="card-img"><img src="${item.img}" alt="${item.title}"></div>
                    <h4>${item.title}</h4>
                    <p>${item.subtitle}</p>
                </div>`
            })
            //连载专区
            const serialWrap = document.getElementById("serialList");
            data.serial.forEach(item=>{
                serialWrap.innerHTML += `
                <div class="drama-card-small">
                    <div class="card-img"><img src="${item.img}" alt="${item.title}"></div>
                    <div>
                        <h4>${item.title}</h4>
                        <p>${item.info}</p>
                    </div>
                </div>`
            })
            //今日更新
            const updateWrap = document.getElementById("todayUpdate");
            data.todayUpdate.forEach(item=>{
                updateWrap.innerHTML += `
                <div class="side-item">
                    <img src="${item.img}">
                    <div>
                        <div>${item.title}</div>
                        <small>${item.desc}</small>
                    </div>
                </div>`
            })
            //人气角色
            const roleWrap = document.getElementById("roleList");
            data.roles.forEach(item=>{
                roleWrap.innerHTML += `
                <div class="role-item">
                    <img src="${item.img}">
                    <div>
                        <div>${item.name}</div>
                        <small>${item.intro}</small>
                    </div>
                </div>`
            })
        })
    </script>
</body>
</html>
