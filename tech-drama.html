---
layout: default
---

<div style="margin:16px 0;">
  <a href="/" style="font-size:17px;text-decoration:none;color:#0066cc;">← 返回首页</a>
</div>

<style>
.category-bar{
  display:flex;
  gap:28px;
  padding:12px 0;
  margin-bottom:24px;
  border-bottom:1px solid #cccccc;
}
.category-bar span{
  font-size:18px;
  color:#222222;
  padding:6px 4px;
  border-bottom:2px solid transparent;
  cursor:pointer;
}
.category-bar span.active{
  color:#0066cc;
  border-bottom:2px solid #0066cc;
}
.category-bar span:hover{
  color:#0066cc;
  border-bottom:2px solid #0066cc;
}
.card-item{
  margin-bottom:22px;
  pointer-events:auto;
}
.card-item h3 a{
  color:#0066cc;
  text-decoration:none;
}
.card-item h3 a:hover{
  text-decoration:underline;
}
</style>

<div class="category-bar">
  <span data-cat="all" class="active">全部</span>
  <span data-cat="航空航天冷知识">航空航天冷知识</span>
  <span data-cat="两弹一星科学家传记系列">两弹一星科学家传记系列</span>
</div>

<div id="cardContainer"></div>

<script>
// 保持你原有json路径，不要改动
const jsonUrl = "/data/tech‑drama.json";
let allData = [];
let currentCat = "all";

fetch(jsonUrl)
.then(res => res.json())
.then(data => {
  allData = data;
  renderList();
});

function renderList(){
  const container = document.getElementById("cardContainer");
  container.innerHTML = "";

  let showList = allData;
  if(currentCat !== "all"){
    showList = allData.filter(item => item.categories.includes(currentCat));
  }

  showList.forEach(post => {
    const div = document.createElement("div");
    div.className = "card-item";
    div.innerHTML = `
      <h3><a href="${post.url}">${post.title}</a></h3>
      <p>${post.excerpt}</p>
    `;
    container.appendChild(div);
  })
}

//分类点击切换
document.querySelectorAll(".category-bar span").forEach(el => {
  el.onclick = function(){
    document.querySelectorAll(".category-bar span").forEach(x=>x.classList.remove("active"));
    this.classList.add("active");
    currentCat = this.dataset.cat;
    renderList();
  }
})
</script>
