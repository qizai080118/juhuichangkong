<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技漫剧</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="index.html" class="back-home">← 返回首页</a>
<section class="banner">
  <img id="drama-banner-img" src="" alt="科技漫剧横幅">
</section>
<div class="category-wrap" id="category-wrap"></div>
<div class="card-list" id="card-list"></div>

<script>
function loadJsonCallback(pageData){
  document.querySelector("#drama-banner-img").src = pageData.banner_bg;
  let catHtml = "";
  pageData.category_list.forEach(function(cat){
    catHtml += '<div class="category-item"><img src="' + cat.icon + '" alt="' + cat.name + '"><div><h4>' + cat.name + '</h4><p>' + cat.desc + '</p></div></div>';
  });
  document.querySelector("#category-wrap").innerHTML = catHtml;

  let cardHtml = "";
  pageData.hot_courses.forEach(function(item, idx){
    cardHtml += '<div class="item-card" onclick="location.href=\'player.html?index=' + idx + '&page=tech-drama\'"><img src="' + item.cover + '" alt="' + item.title + '"><div class="item-info"></div></div>';
  });
  document.querySelector("#card-list").innerHTML = cardHtml;
}

const script = document.createElement('script');
script.src = "data/tech-drama.json";
document.body.appendChild(script);
</script>
</body>
</html>
