<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>科技漫剧</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box;}
body{padding:40px 20px;font‑family:system‑ui;}
#pageTitle{margin‑bottom:24px;}
.card‑wrap{display:grid;grid‑template‑columns:1fr 1fr;gap:16px;}
.drama‑card{
  border:1px solid #ccc;
  border‑radius:12px;
  padding:32px 16px;
  text‑align:center;
  background:#f5f7fa;
  cursor:pointer;
  font‑size:16px;
}
</style>
</head>
<body>
<h2 id="pageTitle"></h2>
<div class="card‑wrap" id="cardWrap"></div>

<script>
async function initHome(){
  const res = await fetch('./tech‑drama.json');
  const list = await res.json();
  document.getElementById('pageTitle').innerText = "科技漫剧";
  //去重获取4个板块
  const map = new Map();
  list.forEach(item=>{
    if(!map.has(item.plateId)){
      map.set(item.plateId, item.plateName);
    }
  })
  const plates = Array.from(map.entries());
  const wrapDom = document.getElementById('cardWrap');
  wrapDom.innerHTML = '';
  plates.forEach(([pid,pname])=>{
    const div = document.createElement('div');
    div.className = "drama‑card";
    div.innerText = pname;
    div.onclick = ()=>{
      //跳转到二级播放页
      location.href = `player.html?plateId=${pid}`;
    }
    wrapDom.appendChild(div);
  })
}
initHome();
</script>
</body>
</html>
