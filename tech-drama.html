<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技漫剧</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="index.html" class="back-home">← 返回首页</a>
<section class="banner">
  <img id="drama-banner-img" src="" alt="科技漫剧横幅">
</section>
<div class="category-wrap" id="category-wrap"></div>
<div class="card-list" id="card-list"></div>

<script>
function loadJson(url, callback){
  window.loadback = function(data){
    callback(null, data);
  };
  const s = document.createElement('script');
  s.src = url;
  s.onerror = ()=>callback(new Error("加载失败:"+url),null);
  document.body.appendChild(s);
}

document.addEventListener('DOMContentLoaded', ()=>{
loadJson("data/tech-drama.json", function(err, pageData){
  if(err){
    document.body.innerHTML += `<div style="color:red;padding:20px">页面加载失败：${err.message}</div>`;
    return;
  }
  document.querySelector("#drama-banner-img").src = pageData.banner_bg;

  let catHtml = "";
  pageData.category_list.forEach(cat=>{
    catHtml += `
    <div class="category-item">
      <img src="${cat.icon}" alt="${cat.name}">
      <div>
        <h4>${cat.name}</h4>
        <p>${cat.desc}</p>
      </div>
    </div>`;
  })
  document.querySelector("#category-wrap").innerHTML = catHtml;

  let cardHtml = "";
  pageData.hot_courses.forEach((item, idx)=>{
    cardHtml += `
    <div class="item-card">
      <img src="${item.cover}" alt="${item.title}">
      <div class="item-info">
        <h3><a href="player.html?index=${idx}">${item.title}</a></h3>
        <p>${item.desc}</p>
        <p>${item.plateName}｜${item.class_num}</p>
      </div>
    </div>`;
  })
  document.querySelector("#card-list").innerHTML = cardHtml;
})
})
</script>
</body>
</html>
